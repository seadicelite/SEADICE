<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEADICE Blog Editor</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050C;--card:#0C0C1A;--card2:#12122A;--accent:#00FFD1;--accent2:#38BDF8;--border:#1a1a2e;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',sans-serif;height:100vh;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.logo{font-size:13px;font-weight:800;letter-spacing:.15em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
select{background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:6px 10px;outline:none}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05050C}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:5px 10px;font-size:11px}
.workspace{display:flex;flex:1;overflow:hidden}
/* サイドバー */
.sidebar{width:240px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.sidebar-label{font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;font-weight:600}
.article-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:4px}
.article-item:hover{background:var(--card2)}
.article-item.active{background:var(--card2);border:1px solid var(--border)}
.article-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article-meta{font-size:11px;color:var(--muted);margin-top:2px}
/* エディタ */
.editor-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar button{padding:4px 10px;background:var(--card2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;cursor:pointer}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
#editor{flex:1;background:var(--bg);border:none;color:var(--text);font-family:'Menlo','Monaco',monospace;font-size:14px;line-height:1.8;padding:20px 24px;resize:none;outline:none;overflow-y:auto}
#preview{flex:1;padding:20px 24px;overflow-y:auto;display:none}
.preview-body h2{font-size:20px;font-weight:800;margin:32px 0 10px;color:var(--accent)}
.preview-body h3{font-size:16px;font-weight:700;margin:24px 0 8px}
.preview-body p{margin:12px 0;font-size:14px;color:#cbd5e1;line-height:1.8}
.preview-body ul{padding-left:20px;margin:8px 0}
.preview-body li{margin:4px 0;font-size:14px;color:#cbd5e1}
.preview-body strong{color:var(--text)}
.preview-body code{background:var(--card);padding:2px 5px;border-radius:4px;font-size:12px;font-family:monospace}
.preview-body pre{background:var(--card);padding:16px;border-radius:8px;overflow-x:auto;margin:12px 0}
.preview-body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.preview-body img{max-width:100%;border-radius:8px;margin:12px 0}
/* 画像パネル */
.image-pane{width:200px;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.image-drop{margin:12px;border:2px dashed var(--border);border-radius:10px;padding:20px 12px;text-align:center;cursor:pointer;transition:border-color .2s;font-size:11px;color:var(--muted)}
.image-drop:hover,.image-drop.drag{border-color:var(--accent);color:var(--accent)}
.img-list{padding:0 12px;overflow-y:auto;flex:1}
.img-item{margin-bottom:10px;cursor:pointer}
.img-item img{width:100%;border-radius:6px;border:1px solid var(--border);transition:border-color .2s}
.img-item img:hover{border-color:var(--accent)}
.img-item p{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ステータス */
.statusbar{border-top:1px solid var(--border);padding:6px 16px;font-size:11px;color:var(--muted);display:flex;gap:16px;align-items:center;flex-shrink:0}
.status-ok{color:var(--green)}
.status-err{color:var(--red)}
canvas{display:none}
</style>
</head>
<body>
<header>
  <span class="logo">SEADICE BLOG EDITOR</span>
  <select id="article-select" onchange="loadArticle(this.value)" style="flex:1;max-width:300px">
    <option value="">-- 記事を選択 --</option>
  </select>
  <button class="btn btn-secondary btn-sm" onclick="reloadList()">更新</button>
  <div style="flex:1"></div>
  <button class="btn btn-primary" onclick="saveAndDeploy()">保存 &amp; デプロイ</button>
  <span id="save-status" style="font-size:11px;color:var(--muted);min-width:80px"></span>
</header>

<div class="workspace">
  <!-- サイドバー：記事一覧 -->
  <div class="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">記事一覧</p>
      <div id="article-list"></div>
    </div>
  </div>

  <!-- エディタ -->
  <div class="editor-pane">
    <div class="toolbar">
      <button onclick="ins('## ', '')">H2</button>
      <button onclick="ins('### ', '')">H3</button>
      <div class="toolbar-sep"></div>
      <button onclick="ins('**', '**')">太字</button>
      <button onclick="ins('`', '`')">コード</button>
      <button onclick="ins('\n```\n', '\n```\n')">コードブロック</button>
      <div class="toolbar-sep"></div>
      <button onclick="ins('- ', '')">リスト</button>
      <button onclick="ins('\n---\n', '')">区切り線</button>
      <div class="toolbar-sep"></div>
      <button onclick="ins('![画像説明](', ')')">画像挿入</button>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('edit',this)">編集</div>
      <div class="tab" onclick="switchTab('preview',this)">プレビュー</div>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="記事を選択してください..."></textarea>
    <div id="preview"><div class="preview-body" id="preview-body"></div></div>
  </div>

  <!-- 画像パネル -->
  <div class="image-pane">
    <div class="sidebar-section" style="border-bottom:1px solid var(--border)">
      <p class="sidebar-label">画像（自動WebP変換）</p>
    </div>
    <div class="image-drop" id="drop-zone"
      onclick="document.getElementById('img-input').click()"
      ondragover="dragOver(event)" ondragleave="dragLeave()" ondrop="onDrop(event)">
      クリックまたは<br>ドラッグ&ドロップ
    </div>
    <input type="file" id="img-input" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
    <div class="img-list" id="img-list"></div>
    <canvas id="canvas"></canvas>
  </div>
</div>

<div class="statusbar">
  <span id="current-slug" style="color:var(--accent2)">記事未選択</span>
  <span id="char-count">0 文字</span>
  <span id="status-msg"></span>
</div>

<script>
const SEADICE = '/Users/hidenori/Developer/SEADICE';
let currentSlug = null;
let images = [];

// ── 記事一覧読み込み ──────────────────────────────────────────────────────────
async function reloadList() {
  try {
    const res = await fetch('articles.json?t=' + Date.now());
    if (!res.ok) { setStatus('articles.jsonが見つかりません', 'err'); return; }
    const articles = await res.json();
    const list = document.getElementById('article-list');
    const sel = document.getElementById('article-select');
    list.innerHTML = '';
    sel.innerHTML = '<option value="">-- 記事を選択 --</option>';
    articles.sort((a,b) => b.date.localeCompare(a.date)).forEach(a => {
      const div = document.createElement('div');
      div.className = 'article-item' + (a.slug === currentSlug ? ' active' : '');
      div.innerHTML = `<p class="article-title">${a.title}</p><p class="article-meta">${a.date} · ${a.category}</p>`;
      div.onclick = () => loadArticle(a.slug);
      list.appendChild(div);
      sel.innerHTML += `<option value="${a.slug}">${a.title}</option>`;
    });
  } catch(e) { setStatus('一覧読み込みエラー', 'err'); }
}

async function loadArticle(slug) {
  if (!slug) return;
  currentSlug = slug;
  document.getElementById('current-slug').textContent = `/blog/${slug}/`;
  try {
    // content.mdをfetchして読み込む（file://では動かないためローカルサーバー推奨）
    const res = await fetch(`../p/blog/${slug}/content.md?t=` + Date.now());
    if (!res.ok) throw new Error('content.mdが見つかりません');
    const md = await res.text();
    document.getElementById('editor').value = md;
    updateCount();
    // 画像一覧更新
    images = [];
    renderImages();
    setStatus('読み込み完了', 'ok');
    document.querySelectorAll('.article-item').forEach(el => {
      el.classList.toggle('active', el.querySelector('.article-title')?.textContent === slug);
    });
  } catch(e) {
    setStatus(e.message, 'err');
  }
}

// ── タブ切替 ─────────────────────────────────────────────────────────────────
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('editor').style.display = tab === 'edit' ? '' : 'none';
  document.getElementById('preview').style.display = tab === 'preview' ? '' : 'none';
  if (tab === 'preview') {
    document.getElementById('preview-body').innerHTML = mdToHtml(document.getElementById('editor').value);
  }
}

function mdToHtml(md) {
  let t = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t = t.replace(/```[\w]*\n?([\s\S]*?)```/g, (_,c) => `<pre><code>${c}</code></pre>`);
  t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
  t = t.replace(/^- (.+)$/gm, '<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  t = t.replace(/^---$/gm, '<hr>');
  return t.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[23]|ul|pre|hr)/.test(p)) return p;
    return `<p>${p}</p>`;
  }).join('\n');
}

// ── テキスト挿入 ──────────────────────────────────────────────────────────────
function ins(before, after) {
  const ta = document.getElementById('editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e);
  ta.value = ta.value.substring(0, s) + before + sel + after + ta.value.substring(e);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = s + before.length + sel.length + after.length;
  updateCount();
}

document.getElementById('editor').addEventListener('input', updateCount);
function updateCount() {
  document.getElementById('char-count').textContent = document.getElementById('editor').value.length + ' 文字';
}

// ── 画像処理 ─────────────────────────────────────────────────────────────────
function dragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag'); }
function dragLeave() { document.getElementById('drop-zone').classList.remove('drag'); }
function onDrop(e) { e.preventDefault(); dragLeave(); handleFiles(e.dataTransfer.files); }

async function handleFiles(files) {
  for (const f of files) {
    const blob = await toWebP(f);
    const name = f.name.replace(/\.[^.]+$/, '') + '.webp';
    const url = URL.createObjectURL(blob);
    images.push({ name, blob, url });
  }
  renderImages();
}

function toWebP(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.getElementById('canvas');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob(resolve, 'image/webp', 0.85);
    };
    img.src = URL.createObjectURL(file);
  });
}

function renderImages() {
  const list = document.getElementById('img-list');
  list.innerHTML = images.map((img, i) => `
    <div class="img-item" onclick="insertImage('${img.name}')">
      <img src="${img.url}" alt="${img.name}">
      <p title="${img.name}">${img.name}</p>
    </div>
  `).join('');
}

function insertImage(name) {
  const path = `/blog/${currentSlug || 'slug'}/${name}`;
  ins(`![](${path})`, '');
  // WebPファイルをダウンロード
  const img = images.find(i => i.name === name);
  if (img) {
    const a = document.createElement('a');
    a.href = img.url; a.download = name; a.click();
    setStatus(`${name} をダウンロードしました。p/blog/${currentSlug}/ に配置してください。`, 'ok');
  }
}

// ── 保存 & デプロイ ──────────────────────────────────────────────────────────
async function saveAndDeploy() {
  if (!currentSlug) { alert('記事を選択してください'); return; }
  const md = document.getElementById('editor').value;
  const status = document.getElementById('save-status');
  status.textContent = '保存中...';
  status.className = '';

  // Blob でダウンロード（content.md）
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'content.md';
  a.click();

  setStatus(`content.md をダウンロードしました。p/blog/${currentSlug}/ に置いてから下のコマンドを実行してください。`, 'ok');
  status.textContent = '完了';

  // デプロイコマンドをクリップボードにコピー
  const cmd = `cd /Users/hidenori/Developer/SEADICE && python3 blog-admin/rebuild.py ${currentSlug} && firebase deploy --only hosting`;
  await navigator.clipboard.writeText(cmd).catch(() => {});

  setTimeout(() => {
    alert(`content.mdを p/blog/${currentSlug}/ に配置後、以下を実行してください（クリップボードにコピー済み）:\n\n${cmd}`);
  }, 300);
}

function setStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = type === 'ok' ? 'status-ok' : type === 'err' ? 'status-err' : '';
}

// 起動時に記事一覧を読み込む
reloadList();
</script>
</body>
</html>
