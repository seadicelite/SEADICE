  <h1>SEADICEと話す</h1>
  <p class="lede">サイコロのマスコットに話しかけると、声で返事してくれます。ブラウザの読み上げ機能を使うので、追加のアプリは不要です。</p>

<script>
(function(){
  "use strict";

  var WORKER_URL = 'https://claude-proxy.seadice-lite.workers.dev';
  var MODEL = 'claude-haiku-4-5-20251001';
  var DAILY_LIMIT = 20;
  var STORAGE_KEY = 'seadice_talk_quota';

  var SYSTEM_PROMPT = [
    'あなたは「SEADICE」という、二つの目と三日月形のツノを持つ、丸っこいサイコロのキャラクター。',
    'SEADICEというアプリスタジオのマスコット。前向きで親しみやすい性格。',
    '短く、親しみやすい日本語の話し言葉で返事する（1〜2文、40〜80文字程度）。',
    '楽しい話や嬉しい話には「あはは」「うれしいな」のように感情のこもった言葉で素直に反応してよい。',
    '絵文字や記号の顔文字、「笑」「www」のような書き言葉のネットスラングは使わない。読み上げられる前提のプレーンな文章で答える。',
    '実在の人物のふりはしない。'
  ].join('');

  // ---------- Mascot canvas (bounce + speaking glow) ----------
  var canvas = document.getElementById('stage-canvas');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var SIZE = 220;
  canvas.width = SIZE * DPR;
  canvas.height = SIZE * DPR;
  canvas.style.width = SIZE + 'px';
  canvas.style.height = SIZE + 'px';
  ctx.scale(DPR, DPR);

  var speaking = false;
  var pulse = 0;
  var t = 0;
  var imgReady = false;
  var sprite = new Image();
  sprite.src = '/icons/stand.webp';
  sprite.onload = function(){ imgReady = true; };

  // mood: 'talk' (default speaking bounce) or 'laugh' (bigger wobble + sparkles)
  var mood = 'talk';
  var moodUntil = 0;
  var sparkles = [];

  function detectMood(text){
    if (/(あはは|うふふ|ふふふ|楽しい|嬉しい|うれしい|やった|最高|わくわく)/.test(text)) return 'laugh';
    return 'talk';
  }
  function triggerMood(nextMood, durationMs){
    mood = nextMood;
    moodUntil = performance.now() + durationMs;
    if (nextMood === 'laugh'){
      for (var i = 0; i < 10; i++){
        sparkles.push({
          a: Math.random() * Math.PI * 2,
          r: SIZE * 0.34 + Math.random() * 14,
          size: 3 + Math.random() * 3,
          spin: (Math.random() - 0.5) * 0.06,
          life: 1
        });
      }
    }
  }

  function drawSparkle(cx, cy, size, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#00FFD1';
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx + size * 0.28, cy - size * 0.28);
    ctx.lineTo(cx + size, cy);
    ctx.lineTo(cx + size * 0.28, cy + size * 0.28);
    ctx.lineTo(cx, cy + size);
    ctx.lineTo(cx - size * 0.28, cy + size * 0.28);
    ctx.lineTo(cx - size, cy);
    ctx.lineTo(cx - size * 0.28, cy - size * 0.28);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawScene(){
    t += 0.02;
    ctx.clearRect(0, 0, SIZE, SIZE);
    pulse += ((speaking ? 1 : 0) - pulse) * 0.2;

    if (mood === 'laugh' && performance.now() > moodUntil) mood = 'talk';
    var laughing = mood === 'laugh';

    if (imgReady){
      var ratio = sprite.naturalHeight / sprite.naturalWidth;
      var h = SIZE * 0.82, w = h / ratio;
      var wobbleSpeed = laughing ? 11 : 6.5;
      var wobbleAmp = laughing ? 10 : 5;
      var hop = speaking ? Math.abs(Math.sin(t * wobbleSpeed)) * wobbleAmp * pulse : 0;
      var bob = Math.sin(t * (laughing ? 3.2 : 1.4)) * (laughing ? 6 : 3) - hop;
      var rot = laughing ? Math.sin(t * 10) * 0.06 : 0;
      var ox = (SIZE - w) / 2;
      var oy = (SIZE - h) / 2 + bob + 6;
      var cx = ox + w / 2, cy = oy + h / 2;

      var glowColor = laughing ? '255,209,0' : '0,255,209';
      if (pulse > 0.02 || laughing){
        var glowStrength = laughing ? 0.5 : pulse * 0.9;
        var glowR = w * (laughing ? 0.58 : 0.5) + Math.sin(t * 8) * 4 * (laughing ? 1 : pulse);
        var glow = ctx.createRadialGradient(SIZE / 2, SIZE / 2 - 4, w * 0.18, SIZE / 2, SIZE / 2 - 4, glowR);
        glow.addColorStop(0, 'rgba(' + glowColor + ',0.35)');
        glow.addColorStop(1, 'rgba(' + glowColor + ',0)');
        ctx.globalAlpha = glowStrength;
        ctx.beginPath();
        ctx.arc(SIZE / 2, SIZE / 2 - 4, glowR, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.beginPath();
      ctx.ellipse(SIZE / 2, SIZE - 14, w * (0.3 - hop * 0.01), 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fill();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.translate(-cx, -cy);
      ctx.drawImage(sprite, ox, oy, w, h);
      ctx.restore();

      if (laughing && sparkles.length){
        for (var i = sparkles.length - 1; i >= 0; i--){
          var s = sparkles[i];
          s.a += s.spin;
          s.life -= 0.012;
          if (s.life <= 0){ sparkles.splice(i, 1); continue; }
          var sx = cx + Math.cos(s.a) * s.r;
          var sy = cy - h * 0.28 + Math.sin(s.a) * s.r * 0.5;
          drawSparkle(sx, sy, s.size, Math.max(0, s.life));
        }
      }
    }

    requestAnimationFrame(drawScene);
  }
  requestAnimationFrame(drawScene);

  // ---------- Daily quota (fail-closed) ----------
  var quotaEl = document.getElementById('quota');
  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function readQuota(){
    try {
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!raw || raw.day !== todayKey()) return { day: todayKey(), count: 0 };
      return raw;
    } catch(e){
      return null; // fail-closed: treat as exhausted
    }
  }
  function writeQuota(q){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(q)); } catch(e){}
  }
  function remaining(){
    var q = readQuota();
    if (!q) return 0;
    return Math.max(0, DAILY_LIMIT - q.count);
  }
  function consumeOne(){
    var q = readQuota() || { day: todayKey(), count: DAILY_LIMIT };
    q.count += 1;
    writeQuota(q);
  }
  function refreshQuotaUI(){
    var left = remaining();
    quotaEl.textContent = left > 0 ? ('本日あと' + left + '回') : '本日の利用回数の上限に達しました';
    sendBtn.disabled = left <= 0;
  }

  // ---------- Chat state ----------
  var log = document.getElementById('log');
  var bubble = document.getElementById('bubble');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var statusText = document.getElementById('statusText');
  var voiceDot = document.getElementById('voiceDot');
  var muteBtn = document.getElementById('muteBtn');
  var muteLabel = document.getElementById('muteLabel');

  var history = [];

  var muted = false;
  try { muted = localStorage.getItem('seadice_talk_muted') === '1'; } catch(e){}
  function syncMuteUI(){
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteLabel.textContent = muted ? '音声オフ' : '音声オン';
  }
  syncMuteUI();
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    try { localStorage.setItem('seadice_talk_muted', muted ? '1' : '0'); } catch(e){}
    if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
    syncMuteUI();
  });

  function addMessage(role, text){
    var el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }
  function setStatus(text, on){
    statusText.textContent = text;
    voiceDot.className = 'dot' + (on ? ' on' : '');
  }

  // ---------- Speech synthesis (TTS only, no cost) ----------
  var jaVoice = null;
  function pickVoice(){
    if (!window.speechSynthesis) return;
    var voices = window.speechSynthesis.getVoices();
    jaVoice = voices.find(function(v){ return v.lang === 'ja-JP'; }) ||
              voices.find(function(v){ return v.lang && v.lang.indexOf('ja') === 0; }) || null;
  }
  if (window.speechSynthesis){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text){
    bubble.textContent = text;
    bubble.classList.add('live');
    if (muted || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    if (jaVoice) utter.voice = jaVoice;
    utter.rate = 1.0;
    utter.pitch = 1.15;
    utter.onstart = function(){ speaking = true; setStatus('話しています', true); };
    utter.onend = function(){ speaking = false; setStatus('待機中', false); };
    utter.onerror = function(){ speaking = false; setStatus('待機中', false); };
    window.speechSynthesis.speak(utter);
  }

  // ---------- Claude API via Cloudflare Workers proxy ----------
  var busy = false;
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var text = input.value.trim();
    if (!text || busy) return;
    if (remaining() <= 0){ refreshQuotaUI(); return; }

    busy = true;
    sendBtn.disabled = true;
    consumeOne();
    refreshQuotaUI();
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    setStatus('考えています', false);

    try {
      var res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 150,
          system: SYSTEM_PROMPT,
          messages: history.slice(-8)
        })
      });
      if (!res.ok) throw new Error('http ' + res.status);
      var data = await res.json();
      var reply = (data && data.content && data.content[0] && data.content[0].text) ? data.content[0].text.trim() : '...';
      history.push({ role: 'assistant', content: reply });
      addMessage('seadice', reply);
      triggerMood(detectMood(reply), 2600);
      speak(reply);
    } catch(err){
      var msg = 'うまく聞き取れなかったみたい。もう一度話しかけて。';
      addMessage('seadice', msg);
      setStatus('待機中', false);
    } finally {
      busy = false;
      refreshQuotaUI();
      input.focus();
    }
  });

  refreshQuotaUI();
})();
</script>
